# FragGFN FIXED-REWARD on the 6TD3 differential — publication-scale (campaign Logs/030).
#
# Publication-scale variant of fraggfn_6td3_docking_fixed.yaml: n_train_steps 400 -> 5000
# (uniform four-way budget). FragGFN is the non-synthesizable fragment foil at max_nodes=6
# (paper-faithful; Logs/046: 9 -> oversized MW -> collapse; seed-42 ran at 9). Docking-in-the-loop via
# DockingBridgeReward, beta=4.
#
# Run (repo root, fraggfn env; docking libs exported for the rgfn subprocess):
#   conda run -n fraggfn python validation/generators/fraggfn/run_fraggfn_fixed.py \
#       --cfg validation/configs/fraggfn_6td3_docking_fixed_5k.yaml --root-dir $SCRATCH/rgfn_runs/experiments

run:
  name: fixed_reward/fraggfn_6td3_5k
  root_dir: experiments
  seed: 42

fixed_reward:
  n_train_steps: 5000
  n_samples: 200
  sample_oversample: 6.0
  top_k: 100
  beta: 4
  system: 6td3
  reward_name: 6td3_diff
  score_units: "clip(-dvina) reward (higher is better; raw dvina in raw_score column)"

reward:
  type: docking
  oracle: docking_6td3_gpu
  norm: 1.0
  clip: 10.0

gflownet:
  max_nodes: 6              # paper-faithful cap (was 9; Logs/046: 9 -> oversized MW -> collapse)
  num_emb: 128
  num_layers: 4
  sampling_tau: 0.9
  learning_rate: 1.0e-4
  print_every: 10
