# Saturn FIXED-REWARD baseline on sEH — a ROUTE-LESS SMILES entrant, same class as S3-GFN/REINVENT.
#
# Saturn is a Mamba-based SMILES language model trained with Augmented Memory, built for SAMPLE
# EFFICIENCY. No reaction model, so no routes: the pool is emitted with has_route=0 and a library
# built from it must have its shared intermediates recovered post-hoc (MultiAiZ -> SPARROW).
#
# FAIRNESS: Saturn optimizes the SAME frozen reward as every other entrant — the Bengio-2021 sEH
# MPNN, reached through our `glue_surrogate` oracle component. The pool is then RE-SCORED on the RAW
# proxy value, the scale the benchmark's mode gate (sEH > 7.0) is defined on. The reward provider
# code is byte-for-byte the REINVENT adapter's, and the two envs agree numerically (ethanol -> 0.0273).
#
# EVERY SATURN-SIDE VALUE BELOW IS THE AUTHORS' OWN, taken from their published reference config
# (experimental_reproduction/constrained_synthesizability/experiment.json): budget 10,000, product
# aggregator, batch 64, sigma 128, augmented memory with 2 rounds, diversity filter ON, and BOTH
# hallucinated memory and beam enumeration OFF. Only the reward and the run plumbing are ours.
#
# Run (repo root, saturn env; candidate emission shells to the rgfn env):
#   conda run -p /scratch/markymoo/conda_envs/saturn python \
#     validation/generators/saturn/run_saturn_fixed.py \
#     --cfg validation/configs/saturn_seh_fixed.yaml --root-dir $SCRATCH/rgfn_runs/experiments

run:
  name: fixed_reward/saturn_seh
  root_dir: experiments
  seed: 42

fixed_reward:
  system: seh
  reward_name: seh_proxy
  # THE STOPPING CONDITION. Saturn runs `while not oracle.budget_exceeded()` — there is no step
  # count. 10,000 is its published default, an order of magnitude below REINVENT's ~128,000 and
  # S3-GFN's ~320,000. All three are their authors' defaults; the benchmark REPORTS that asymmetry
  # rather than forcing a parity that would misrepresent a method whose entire claim is efficiency.
  budget: 10000
  allow_oracle_repeats: false
  aggregator: product
  n_samples: 2000                        # unique valid molecules to emit — matches S3-GFN/REINVENT
  sample_batch_size: 256
  max_sample_batches: 4000
  score_units: "seh_mpnn_reward (higher is better)"

reward:
  type: seh_proxy
  model_path: ""                         # unused for seh_proxy (weights ship with gflownet)
  device: cpu                            # component device — Saturn's Mamba agent owns the GPU
  rescore_device: cpu
  # RAW -> [0,1] for Saturn's reward aggregation. Same parameters as the REINVENT adapter's
  # transform, so the two entrants chase an identically shaped objective. Deliberately NOT centred
  # on the 7.0 mode gate: shaping at the gate would make the generator optimize the benchmark's own
  # threshold, which is circular.
  reward_shaping:
    transformation_function: sigmoid
    parameters:
      low: 4.0
      high: 9.0
      k: 0.5

saturn:
  device: cuda
  logging_frequency: 1000               # checkpoint every 1,000 ORACLE CALLS (Saturn's own unit).
                                        # Authors use 5000; this is logging cadence only -- the branch at
                                        # reinforcement_learning.py:198 does write_out_results + agent.save and
                                        # nothing else, so it cannot affect training.
  model_architecture: mamba              # rnn | decoder | mamba — Mamba is the paper's contribution
  prior: ""                              # default: external/saturn/.../chembl-33-mamba-epoch-18.prior
                                         # ChEMBL-33 chosen over zinc-250k: it is the same training
                                         # corpus family as REINVENT's prior, so the two route-less
                                         # entrants start from comparable chemical space.
  reinforcement_learning:
    batch_size: 64
    learning_rate: 0.0001
    sigma: 128.0
    augmented_memory: true
    augmentation_rounds: 2
    selective_memory_purge: true
  experience_replay:
    memory_size: 100
    sample_size: 10
  # ON by design and by the authors' default. Saturn's RL is reward-maximizing; a collapsed pool
  # cannot reach the 100-mode deliverable, and we would only find out after ~2.25 h of route
  # discovery. Also the charitable setting.
  diversity_filter:
    name: IdenticalMurckoScaffold
    bucket_size: 10
  # Both OFF, matching the authors' reference config. Beam enumeration additionally carries a
  # `patience` early-stop that would end a run before the oracle budget was spent, which would make
  # the training budget vary between seeds and targets.
  hallucinated_memory:
    execute_hallucinated_memory: false
  beam_enumeration:
    execute_beam_enumeration: false
