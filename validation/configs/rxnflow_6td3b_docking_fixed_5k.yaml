# RxnFlow FIXED-REWARD on 6TD3-B (gnina CNN_VS) — publication scale (benchmark_v2).
#
# RxnFlow's entry for the CDK12-DDB1 cell. Same protein, same docking, same poses as
# rxnflow_6td3_docking_fixed_5k.yaml; DIFFERENT reward. 6TD3's Vina Tier2-Tier1 differential is
# retained unchanged for reproducibility but SUPERSEDED for training (Logs/072) — the generator
# games it, clearing the differential's own gate 78% of the time against 67% for real glues while
# clearing a CNN gate 0 times out of 400. 6TD3-B rewards gnina's CNN_VS = CNNaffinity x CNNscore
# on the selected Tier-2 pose. Per-step docking-in-the-loop via DockingBridgeReward (shells out to
# scripts/score_batch.py under the rgfn env), SHARED SMALL library, beta=4, routes emitted.
#
# NOTE ON THE SIBLING'S HEADER: rxnflow_6td3_docking_fixed_5k.yaml claims "max_reactions 4 -> 5"
# while its body sets 4. The body is operative — the +1-reaction idea was dropped for the campaign
# (Logs/030 Results, and the SCENT 5k config says so explicitly). The stale claim is not copied.
#
# ⚠ THE `higher_is_better` LINE BELOW IS LOAD-BEARING — DO NOT DELETE IT.
# DockingBridgeReward negates the raw score by default, which is correct for dvina/Vina and
# catastrophic here. cnn_vs is HIGHER-is-better in roughly [0, 9], so the default
# `max(-raw/norm, 0)` maps EVERY molecule to exactly 0.0: a perfectly flat reward. It does not
# raise, does not produce a nan, and does not show up in the logs — the run would burn its full
# docking budget training against a constant and finish looking healthy. This cross-env bridge
# has no access to the oracle class or to targets.py, so the config is the only place that can
# say it. run_rxnflow_fixed.py echoes the resolved orientation at startup
# ("[RXN-FR] docking oracle=... higher_is_better=True (sign=+1)") — check that line before
# letting a 6TD3-B run past its first few steps.
#
# ⚠ USE THE PRODUCT, NEVER THE AFFINITY HEAD ALONE. `cnnaff_t2` on its own is BLIND to exactly
# the failure this reward exists to fix: AUROC 0.521 — a coin flip — separating real glues from
# our own reward-optimised candidates (gnina's affinity head is hinge-trained on high-RMSD poses,
# penalised only for over-predicting). `cnn_vs` gives 0.917 vs property-matched decoys and 0.946
# vs our candidates. Repointing the oracle at the affinity term would produce a model optimising
# a coin flip — and the reward would NOT be flat, so it would look like it was working.
#
# BETA / NORM / CLIP UNCHANGED FROM THE 6TD3 TEMPLATE — a decision, not copied lines. The value
# the GFN sees spans roughly [0, 9] for cnn_vs against roughly [0, 8] for clip(-dvina): a ~12%
# difference in range, too small to justify re-tuning an inverse temperature matched to the RGFN
# docking benchmark, and keeping beta=4 is what makes 6TD3-B comparable to the 6TD3 and ClpP
# cells. norm = 1.0 is "no rescaling" in both. clip = 10.0 is an upper bound applied as
# exp(min(value, clip)) (fixed_reward.py:222) and binds in NEITHER case, since both value ranges
# top out below 10; it is kept so this file stays diff-comparable with its 6TD3 sibling.
#
# Run (repo root, rxnflow env; docking libs exported for the rgfn subprocess):
#   conda run -n rxnflow python validation/generators/rxnflow/run_rxnflow_fixed.py \
#       --cfg validation/configs/rxnflow_6td3b_docking_fixed_5k.yaml --root-dir $SCRATCH/rgfn_runs/experiments

run:
  name: fixed_reward/rxnflow_6td3b_5k
  root_dir: experiments
  seed: 42

fixed_reward:
  n_train_steps: 5000
  n_samples: 200
  sample_oversample: 6.0
  top_k: 100
  beta: 4
  system: 6td3b
  # '6td3b' matches BOTH matrix16/targets.py (Target.reward_name = "6td3b", gate 6.718) and the
  # worker vocabularies (_DOCKING_REWARDS / _HIGHER_IS_BETTER_BY_REWARD key on "6td3b"). The 6td3
  # sibling writes '6td3_diff' where targets.py says "6td3" — a mismatch not copied forward here.
  reward_name: 6td3b
  score_units: "cnn_vs = CNNaffinity x CNNscore (higher is better; raw cnn_vs in raw_score column)"

reward:
  type: docking
  oracle: docking_6td3b_gpu
  norm: 1.0
  clip: 10.0            # exp(min(value, clip)); non-binding for cnn_vs — see header
  higher_is_better: true  # cnn_vs: LOAD-BEARING, see the warning above

rxnflow:
  env_dir: data/models/rxnflow_env_stdlib  # SHARED library (glue_standard_v1 baked)
  max_reactions: 4                          # original cap (matched to RGFN); -> gflownet algo.max_len
  num_emb: 128
  num_layers: 4
  sampling_tau: 0.9
  learning_rate: 1.0e-4
  print_every: 10
  action_sampling_ratio: 0.01
