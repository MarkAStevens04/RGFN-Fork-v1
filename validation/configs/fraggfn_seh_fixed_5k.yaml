# FragGFN FIXED-REWARD on sEH (surrogate) — publication-scale (campaign Logs/030).
#
# Publication-scale variant of fraggfn_seh_fixed.yaml. The surrogate cell already ran 5000
# steps. FragGFN now uses max_nodes=6 (paper-faithful; Logs/046 found 9 -> oversized MW ->
# reward collapse). The seed-42 leg ran at 9 before that fix; seeds 43/44 use 6.
# Frozen Bengio-2021 sEH proxy, beta=8, non-synthesizable (has_route=0).
#
# Run (repo root, fraggfn env; candidate emission shells to the rgfn env):
#   conda run -n fraggfn python validation/generators/fraggfn/run_fraggfn_fixed.py \
#       --cfg validation/configs/fraggfn_seh_fixed_5k.yaml --root-dir $SCRATCH/rgfn_runs/experiments

run:
  name: fixed_reward/fraggfn_seh_5k
  root_dir: experiments
  seed: 42

fixed_reward:
  n_train_steps: 5000
  n_samples: 1000
  sample_oversample: 4.0
  top_k: 100
  beta: 8

reward:
  clip: 10.0
  batch_size: 128

gflownet:
  max_nodes: 6              # paper-faithful cap (was 9; Logs/046: 9 -> oversized MW -> collapse)
  num_emb: 128
  num_layers: 4
  sampling_tau: 0.9
  learning_rate: 1.0e-4
  print_every: 100
