# REINVENT 4 FIXED-REWARD baseline on sEH — a ROUTE-LESS SMILES entrant, same class as S3-GFN.
#
# REINVENT is AstraZeneca's production de-novo tool: a ChEMBL-pretrained SMILES RNN fine-tuned by
# reinforcement learning (DAP) against a weighted score. No reaction model, so no routes: the pool is
# emitted with has_route=0 and a library built from it must have its shared intermediates recovered
# post-hoc (MultiAiZ -> SPARROW). It is the baseline reviewers name first.
#
# FAIRNESS: REINVENT optimizes the SAME frozen reward as every other entrant — the Bengio-2021 sEH
# MPNN, reached through our GlueSurrogate plugin component. The pool is then RE-SCORED on the RAW
# proxy value, which is the scale the benchmark's mode gate (sEH > 7.0) is defined on.
#
# Run (repo root, reinvent4 env; candidate emission shells to the rgfn env):
#   conda run -n reinvent4 python validation/generators/reinvent/run_reinvent_fixed.py \
#       --cfg validation/configs/reinvent_seh_fixed.yaml --root-dir $SCRATCH/rgfn_runs/experiments

run:
  name: fixed_reward/reinvent_seh        # run dir: <root>/fixed_reward/reinvent_seh/<timestamp>
  root_dir: experiments                  # overridden by --root-dir on Balam ($SCRATCH)
  seed: 42

fixed_reward:
  system: seh
  reward_name: seh_proxy
  n_samples: 2000                        # unique valid molecules to emit — matches S3-GFN's pool
  sample_oversample: 6.0                 # draws requested from the trained agent to reach n_samples
  score_units: "seh_mpnn_reward (higher is better)"

reward:
  type: seh_proxy
  model_path: ""                         # unused for seh_proxy (weights ship with gflownet)
  device: cpu                            # scoring component device — see comp_glue_surrogate.py
  rescore_device: cpu                    # device for the final raw re-score of the pool
  # RAW -> [0,1] for REINVENT's DAP objective. Deliberately NOT centred on the 7.0 mode gate:
  # transforming at the gate would make REINVENT optimize the benchmark's own threshold, which is
  # circular. This is a smooth ramp across the proxy's useful range (calibrated 5-6, Logs/034), so
  # the gate at 7.0 sits high on the curve without being encoded in it.
  transform:
    type: sigmoid
    low: 4.0
    high: 9.0
    k: 0.5

reinvent:
  device: cuda:0
  prior_file: ""                         # default: external/reinvent/priors/reinvent.prior
  batch_size: 64                         # AUTHORS' value (configs/toml/staged_learning.toml)
  # ORACLE BUDGET — a REPORTED asymmetry, not an equalized one (the project's standing convention;
  # cf. Logs/056's "surrogate calls ~500 vs 155,764"). 1000 steps x 128 = ~128,000 reward calls,
  # the same order as S3-GFN's 5,000 steps x 64. REINVENT is often benchmarked at PMO's 10,000-call
  # budget instead; that is ~13x less than every other entrant here gets, so we run it at the
  # generous end. If a reviewer asks, the answer is that the baseline was over-fed, not starved.
  max_steps: 157                         # 157 x 64 = 10,048 scored -- the PMO budget.
                                         # WAS 1000 x 128 = 128,000, a 12.4x advantage over
                                         # Saturn's 10,020 (audit 2026-08-20). REINVENT has no
                                         # budget field: steps x batch IS the budget.
  checkpoint_every_steps: 16             # ~1,024 scored molecules per checkpoint (16 x 64).
                                         # Implemented as REINVENT's OWN multi-stage mechanism
                                         # (10 stages summing to 157), not an upstream patch: its
                                         # RL loop has no save hook. purge_memories=false and a
                                         # top-level diversity filter mean nothing resets between
                                         # stages, so training is unchanged.
  sigma: 128                             # DAP reward-function sigma (REINVENT's documented default)
  learning_rate: 0.0001
  # ON BY DESIGN. REINVENT's RL is reward-maximizing and collapses onto one scaffold without this;
  # a collapsed pool cannot reach the 100-mode deliverable and we would only find out after paying
  # ~2.25 h of route discovery on it. This is also the charitable setting.
  diversity_filter:
    type: IdenticalMurckoScaffold
    bucket_size: 25
    minscore: 0.4
    minsimilarity: 0.4
