# FragGFN FIXED-REWARD on DRD2 (surrogate) — publication-scale (campaign Logs/030).
#
# Publication-scale variant of fraggfn_drd2_fixed.yaml. Surrogate cell already ran 5000 steps
# FragGFN now uses max_nodes=6 (paper-faithful; Logs/046: 9 -> oversized MW -> DRD2 collapse).
# Seed-42 ran at 9 before that fix; seeds 43/44 use 6. Frozen DRD2 TDC activity oracle, beta=48,
# non-synthesizable (has_route=0).
#
# Run (repo root, fraggfn env; candidate emission shells to the rgfn env):
#   conda run -n fraggfn python validation/generators/fraggfn/run_fraggfn_fixed.py \
#       --cfg validation/configs/fraggfn_drd2_fixed_5k.yaml --root-dir $SCRATCH/rgfn_runs/experiments

run:
  name: fixed_reward/fraggfn_drd2_5k
  root_dir: experiments
  seed: 42

fixed_reward:
  n_train_steps: 5000
  n_samples: 1000
  sample_oversample: 4.0
  top_k: 100
  beta: 48
  system: drd2
  reward_name: drd2
  score_units: "drd2_tdc_activity (higher is better; 0-1)"

reward:
  type: drd2
  model_path: /home/markymoo/projects/RGFN_Fork/RGFN-Fork/oracle/drd2_current.pkl
  clip: 10.0

gflownet:
  max_nodes: 6              # paper-faithful cap (was 9; Logs/046: 9 -> oversized MW -> collapse)
  num_emb: 128
  num_layers: 4
  sampling_tau: 0.9
  learning_rate: 1.0e-4
  print_every: 100
