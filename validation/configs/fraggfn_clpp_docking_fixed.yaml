# FragGFN FIXED-REWARD baseline on ClpP GPU DOCKING (single target).
#
# Per-step docking-in-the-loop for the non-synthesizable foil: each training step shells to
# `conda run -n rgfn scripts/score_batch.py --oracle docking_clpp` (QV2-GPU + gnina) via
# DockingBridgeReward, training FragGFN on clip(-Vina). No AL loop, no oracle. FragGFN uses
# its OWN fragment library (the deliberate native foil). Matches RGFN's
# configs/glue/fixed_reward_clpp_docking.gin (beta=4, 400 iters). See Logs/021.
#
# Run (repo root, fraggfn env; docking libs must be exported for the rgfn subprocess):
#   conda run -n fraggfn python validation/generators/fraggfn/run_fraggfn_fixed.py \
#       --cfg validation/configs/fraggfn_clpp_docking_fixed.yaml --root-dir $SCRATCH/rgfn_runs/experiments

run:
  name: fixed_reward/fraggfn_clpp
  root_dir: experiments
  seed: 42

fixed_reward:
  # ⛔ THIS NUMBER IS THE BUDGET, AND IT DOES NOT TRANSFER BETWEEN TARGETS (recalibrated 2026-09-24).
  # This entrant has no "stop at N molecules" setting -- unlike saturn/synformer/tango, whose configs
  # carry a real `budget:` -- so its round count IS its budget, exactly as the REINVENT config states
  # it: "steps x batch IS the budget". That makes the round count a PRESENTATION budget while arm A is
  # a DISTINCT-molecule budget, and the two agree only at a ~100% unique rate.
  #
  # Was 400 IN THIS FILE and 157 IN THE RUN. The committed file and what actually executed disagreed,
# and the run's own run_config.yaml is the authority: all six frozen ClpP cells record
# n_train_steps: 157. I calibrated against the file first and got 435 -- nearly 3x too many --
# because 400 steps implied 25.1 rows/step where the real run does 64.0. Re-derived from the run:
# 157 steps reached 9,258-9,375 distinct, 6-7% short, and ~12 more steps closes it.
  #
  # Calibrated from the landed traces of these very cells: the round at which cumulative DISTINCT
  # first reaches 10,000, per seed, sized to the worst seed so every seed lands inside 0.95-1.10x.
  # Projected landing: 10,128 / 10,124 / 10,000 (sized to the worst seed, 169).
  #
  # If this config is ever copied to a new target, RE-DERIVE this number. Copying it is what produced
  # the defect above. measure_repeat_rate now reports OVER as well as SHORT, so a bad copy is caught.
  n_train_steps: 169
  n_samples: 200
  sample_oversample: 6.0
  top_k: 100
  beta: 4
  system: clpp
  reward_name: clpp_docking
  score_units: "clip(-vina) reward (higher is better; raw Vina kcal/mol in raw_score column)"

reward:
  type: docking
  oracle: docking_clpp
  norm: 1.0
  clip: 10.0

gflownet:
  max_nodes: 9
  num_emb: 128
  num_layers: 4
  sampling_tau: 0.9
  learning_rate: 1.0e-4
  print_every: 10
