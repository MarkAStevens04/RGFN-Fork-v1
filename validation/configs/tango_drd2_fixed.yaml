# TANGO on DRD2 — Saturn's agent plus a CONSTRAINED-SYNTHESIZABILITY reward.
#
# TANGO IS NOT A SEPARATE MODEL. It is a reward function inside the same Saturn repo
# ([guo2026tango]); this config is `saturn_drd2_fixed.yaml` with one extra oracle component, which is
# exactly how the authors' own experimental_reproduction/constrained_synthesizability/experiment.json
# is built. Everything below the `tango:` block is unchanged from the Saturn entrant, so any
# TANGO-vs-Saturn difference is attributable to the reward and nothing else.
#
# WHY IT MATTERS HERE: syntheseus writes a real synthesis route per solved molecule, so TANGO joins
# SynFormer as a REACTION-AWARE entrant whose molecules are priced through
# `sparrow_select_frontier.py --route-source external` — no MultiAiZ, and no route-planning
# asymmetry against our own generators.
#
# Run:
#   TARGET=drd2 SEED=42 CFG=validation/configs/tango_drd2_fixed.yaml \
#     sbatch experiments/lsd_hubs/campaign/submit_saturn.sh

run:
  name: fixed_reward/tango_drd2
  root_dir: experiments
  seed: 42

fixed_reward:
  system: drd2
  reward_name: drd2
  # THE STOPPING CONDITION. Saturn runs `while not oracle.budget_exceeded()` — there is no step
  # count. 10,000 is its published default, an order of magnitude below REINVENT's ~128,000 and
  # S3-GFN's ~320,000. All three are their authors' defaults; the benchmark REPORTS that asymmetry
  # rather than forcing a parity that would misrepresent a method whose entire claim is efficiency.
  budget: 10000
  allow_oracle_repeats: false
  aggregator: product
  n_samples: 2000                        # unique valid molecules to emit — matches S3-GFN/REINVENT
  sample_batch_size: 256
  max_sample_batches: 4000
  score_units: "drd2_tdc_activity (higher is better; 0-1)"

reward:
  type: drd2
  model_path: /home/markymoo/projects/RGFN_Fork/RGFN-Fork/oracle/drd2_current.pkl
  device: cpu                            # component device — Saturn's Mamba agent owns the GPU
  rescore_device: cpu
  # NO shaping: the DRD2 oracle already returns a probability on [0, 1], which is exactly what
  # Saturn's reward aggregation wants. Matches the REINVENT adapter, which omits its transform here
  # for the same reason. Adding one would be a knob that looks meaningful and is not.
  reward_shaping:
    transformation_function: no_transformation

saturn:
  device: cuda
  logging_frequency: 1000               # checkpoint every 1,000 ORACLE CALLS (Saturn's own unit).
                                        # Authors use 5000; this is logging cadence only -- the branch at
                                        # reinforcement_learning.py:198 does write_out_results + agent.save and
                                        # nothing else, so it cannot affect training.
  model_architecture: mamba              # rnn | decoder | mamba — Mamba is the paper's contribution
  prior: ""                              # default: external/saturn/.../chembl-33-mamba-epoch-18.prior
                                         # ChEMBL-33 chosen over zinc-250k: it is the same training
                                         # corpus family as REINVENT's prior, so the two route-less
                                         # entrants start from comparable chemical space.
  reinforcement_learning:
    batch_size: 64
    learning_rate: 0.0001
    sigma: 128.0
    augmented_memory: true
    augmentation_rounds: 2
    selective_memory_purge: true
  experience_replay:
    memory_size: 100
    sample_size: 10
  # ON by design and by the authors' default. Saturn's RL is reward-maximizing; a collapsed pool
  # cannot reach the 100-mode deliverable, and we would only find out after ~2.25 h of route
  # discovery. Also the charitable setting.
  diversity_filter:
    name: IdenticalMurckoScaffold
    bucket_size: 10
  # Both OFF, matching the authors' reference config. Beam enumeration additionally carries a
  # `patience` early-stop that would end a run before the oracle budget was spent, which would make
  # the training budget vary between seeds and targets.
  hallucinated_memory:
    execute_hallucinated_memory: false
  beam_enumeration:
    execute_beam_enumeration: false

  # ---- TANGO ---------------------------------------------------------------------------------
  tango:
    enabled: true
    env_name: syntheseus                  # `conda run -n syntheseus`; /scratch/markymoo/conda_envs
                                          # is registered in envs_dirs so the NAME resolves.
    reaction_model: megan                 # THE AUTHORS' choice in their reproduction config.
    # The authors' own general stock, published with the paper (figshare 27225483): 17,721,980
    # purchasable SMILES. NOT ZINCFrag — that is a combinatorial FRAGMENT set for assembling
    # molecules, and holds only 4 of 11 probe commodity reagents (no bromobenzene, no acetyl
    # chloride), which made every one of 50 test molecules unsolvable. This stock holds 11/11.
    building_blocks_file: /scratch/markymoo/tango/authors_stock/frag-reac-zinc-stock.smi
    # THE ENFORCED SET IS NOT OPTIONAL. TANGO's dense reward IS the constrained-synthesizability
    # signal: `node_rewards` is only ever written inside `if self.enforce_blocks and solved`
    # (syntheseus.py:252), so with enforce_blocks=false the component returns 0 for EVERY molecule --
    # and with the authors' `product` aggregator that zeroes the whole objective, silently. Running
    # TANGO without an enforced set is not "unconstrained TANGO", it is a broken run.
    # This is the authors' own published constraint set (figshare 27225483), 99 blocks, the one their
    # headline arm uses. The chemistry-homogenized arm swaps in our 418 glue blocks and changes
    # nothing else.
    enforced_building_blocks_file: /scratch/markymoo/tango/authors_stock/enforced_stock_100.smi
    enforce_blocks: true
    enforce_start: false
    use_dense_reward: true
    reward_type: tango_fms
    tango_weights:
      tanimoto: 0.5
      fg: 0.5
      fms: 0.5
    time_limit_s: 180                     # the authors' per-molecule search cap
    parallelize: false                    # the authors' value
    max_workers: 4
    num_top_results: 5                    # OUR DEVIATION, measured: upstream hardcodes 1, which
                                          # solved 10/50 molecules; 5 solves 47/50. Disclosed.
